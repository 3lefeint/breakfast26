  # TM1637 #4 — Remaining/target (left 3) + Turn score/total (right 3)
  #             Elimination: target to beat (left) | turn total (right)
  #             Freeplay: total score (right)
  - platform: tm1637
    id: disp_remaining_turn
    clk_pin: GPIO9
    dio_pin: GPIO10
    intensity: 5
    update_interval: 200ms
    lambda: |-
      if (id(board_stopped) || id(g_mode) != 0) {
        // The six digits as left | right, by game:
        //   Field Training   darts left | points          Black Belt   field up | fields done (bELt: the belt)
        //   Warm-up          field up | fields done        Checkout     score left | attempt
        //   Target Battle    t<target> | r<round>          Killer       n<number> | players left
        char normal[7];
        char left[4];
        char right[4];
        strcpy(left, "---");
        strcpy(right, "---");
        int mode = id(g_mode);
        if (id(board_stopped)) {
          strcpy(left, "Sto");
          strcpy(right, "P  ");
        } else if (mode == 1) {
          snprintf(left, sizeof(left), "%03d", std::max(0, std::min(999, id(g_total) - id(g_thrown))));
          snprintf(right, sizeof(right), "%03d", std::min(999, id(g_points)));
        } else if (mode == 2 && id(g_belt)) {
          strcpy(left, "bEL");
          strcpy(right, "t  ");
        } else if (mode == 2) {
          if (id(g_target) == 25) strcpy(left, "bUL");
          else snprintf(left, sizeof(left), "d%02d", id(g_target) % 100);
          snprintf(right, sizeof(right), "%03d", std::min(999, id(g_done)));
        } else if (mode == 3) {
          std::string k = id(g_kind);
          if (k == "bull") strcpy(left, "bUL");
          else if (k == "eye") strcpy(left, "d50");
          else snprintf(left, sizeof(left), "%c%02d", k == "big" ? 'b' : k == "small" ? 'S' : k == "double" ? 'd' : 't', id(g_target) % 100);
          snprintf(right, sizeof(right), "%03d", std::min(999, id(g_done)));
        } else if (mode == 4) {
          snprintf(left, sizeof(left), "%03d", std::max(0, std::min(999, id(g_remaining))));
          snprintf(right, sizeof(right), "%03d", std::min(999, id(g_attempt)));
        } else if (mode == 5) {
          snprintf(left, sizeof(left), "t%02d", id(g_target) % 100);
          snprintf(right, sizeof(right), "r%02d", id(g_round) % 100);
        } else if (mode == 6) {
          snprintf(left, sizeof(left), "n%02d", id(g_target) % 100);
          snprintf(right, sizeof(right), "%03d", std::min(999, id(g_alive)));
        }
        snprintf(normal, sizeof(normal), "%s%s", left, right);
        // Physical wiring reverses digit order — swap within each 3-digit group.
        char out[7];
        out[0] = normal[2]; out[1] = normal[1]; out[2] = normal[0];
        out[3] = normal[5]; out[4] = normal[4]; out[5] = normal[3];
        out[6] = '\0';
        it.print(out);
        return;
      }

      if (id(elim_active)) {
        // passes = score > target, so target itself isn't enough to beat
        // it — show the actual minimum passing score.
        int tgt = id(elim_freipass) ? 0 : id(elim_target) + 1;
        int tot = id(elim_total);
        if (tgt > 999) tgt = 999;
        if (tot > 999) tot = 999;
        char normal[7];
        snprintf(normal, sizeof(normal), "%03d%03d", tgt, tot);
        char out[7];
        out[0] = normal[2]; out[1] = normal[1]; out[2] = normal[0];
        out[3] = normal[5]; out[4] = normal[4]; out[5] = normal[3];
        out[6] = '\0';
        it.print(out);
        return;
      }

      bool match_on = id(ad_match_started).has_state() && id(ad_match_started).state;

      if (!match_on) {
        char right[4];
        if (id(fp_count) > 0) {
          int tot = id(fp_total);
          if (tot > 999) tot = 999;
          snprintf(right, sizeof(right), "%03d", tot);
        } else {
          strcpy(right, "---");
        }
        // Left side empty, total on right — same reversal as game mode.
        char normal[7];
        snprintf(normal, sizeof(normal), "---%s", right);
        char out[7];
        out[0] = normal[2]; out[1] = normal[1]; out[2] = normal[0];
        out[3] = normal[5]; out[4] = normal[4]; out[5] = normal[3];
        out[6] = '\0';
        it.print(out);
        return;
      }

      int remaining = 0;
      int turn_score = 0;
      bool turn_active = id(ad_turn_active).has_state() && id(ad_turn_active).state;

      if (id(ad_remaining).has_state()) {
        remaining = (int) id(ad_remaining).state;
      }
      if (id(ad_turn_score).has_state()) {
        turn_score = (int) id(ad_turn_score).state;
      }

      if (remaining < 0) remaining = 0;
      if (remaining > 999) remaining = 999;
      if (turn_score < 0) turn_score = 0;
      if (turn_score > 999) turn_score = 999;

      if (turn_active && turn_score > 0) {
        id(cached_turn_score) = turn_score;
      }

      char left[4];
      snprintf(left, sizeof(left), "%03d", remaining);

      char right[4];
      if (turn_active) {
        snprintf(right, sizeof(right), "%03d", id(cached_turn_score));
      } else {
        snprintf(right, sizeof(right), "  -");
      }

      // Physical wiring reverses digit order — swap within each 3-digit group.
      char normal[7];
      snprintf(normal, sizeof(normal), "%s%s", left, right);

      char out[7];
      out[0] = normal[2];
      out[1] = normal[1];
      out[2] = normal[0];
      out[3] = normal[5];
      out[4] = normal[4];
      out[5] = normal[3];
      out[6] = '\0';

      it.print(out);

# ─── LED strip ────────────────────────────────────────────────────────────────

light:
  - platform: esp32_rmt_led_strip
    id: autodarts_strip
    name: "Autodarts LED Strip"
    pin: GPIO0
    chipset: SK6812
    num_leds: 5
    rgb_order: GRB
    is_rgbw: true
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

    color_correct: [50%, 50%, 50%, 50%]

    effects:
      # ── Dart count effects ──────────────────────────────────────────────────
      - addressable_lambda:
          name: "Dart 1 Orange"
          update_interval: 500ms
          lambda: |-
            it.all() = Color(0, 0, 0);
            it[1] = Color(255, 80, 0);
            it[2] = Color(255, 80, 0);
            it[3] = Color(255, 80, 0);

      - addressable_lambda:
          name: "Dart 2 Yellow"
          update_interval: 500ms
          lambda: |-
            it.all() = Color(0, 0, 0);
            it[2] = Color(220, 180, 0);

      # Dart 3: 2 s green (Zug fertig) → orange (Darts ziehen) → >35 s roter Fehlerblink
      - addressable_lambda:
          name: "Dart 3 Sequence"
          update_interval: 100ms
          lambda: |-
            uint32_t elapsed = millis() - (uint32_t)id(led_effect_start_ms);
            if (elapsed < 2000) {
              it.all() = Color(0, 200, 0);
            } else if (elapsed < 35000) {
              it.all() = Color(255, 80, 0);
            } else {
              bool on = ((elapsed / 800) % 2) == 0;
              it.all() = on ? Color(200, 0, 0) : Color(60, 20, 0);
            }

      # Bust: 3 s rotes Blinken → orange (Darts ziehen) → >35 s Fehlerblink
      - addressable_lambda:
          name: "Bust Red"
          update_interval: 100ms
          lambda: |-
            uint32_t elapsed = millis() - (uint32_t)id(led_effect_start_ms);
            if (elapsed < 3000) {
              bool on = ((elapsed / 300) % 2) == 0;
              it.all() = on ? Color(200, 0, 0) : Color(0, 0, 0);
            } else if (elapsed < 35000) {
              it.all() = Color(255, 80, 0);
            } else {
              bool on = ((elapsed / 800) % 2) == 0;
              it.all() = on ? Color(200, 0, 0) : Color(60, 20, 0);
            }

      # Win: grüne Füll-Animation + Gold/Grün-Blink für 10 s, dann aus
      - addressable_lambda:
          name: "Win Celebrate"
          update_interval: 100ms
          lambda: |-
            uint32_t elapsed = millis() - (uint32_t)id(led_effect_start_ms);
            if (elapsed >= 10000) { it.all() = Color(0, 0, 0); return; }
            int step = (elapsed / 100) % 10;
            int n = it.size();
            if (step < n) {
              it.all() = Color(0, 0, 0);
              for (int i = 0; i <= step; i++) it[i] = Color(0, 220, 0);
            } else {
              bool gold = ((step - n) % 2) == 0;
              Color c = gold ? Color(255, 150, 0) : Color(0, 220, 0);
              for (int i = 0; i < n; i++) it[i] = c;
            }

      # Life lost: 3 red pulses (1.5 s) then caller returns strip to Elimination Lives
      - addressable_lambda:
          name: "Life Lost"
          update_interval: 100ms
          lambda: |-
            uint32_t elapsed = millis() - (uint32_t)id(led_effect_start_ms);
            if (elapsed >= 1500) { it.all() = Color(0, 0, 0); return; }
            bool on = ((elapsed / 250) % 2) == 0;
            it.all() = on ? Color(200, 0, 0) : Color(0, 0, 0);

      # Eliminated: rapid red strobe 2 s, then dim glow, caller returns to Lives or off
      - addressable_lambda:
          name: "Eliminated"
          update_interval: 100ms
          lambda: |-
            uint32_t elapsed = millis() - (uint32_t)id(led_effect_start_ms);
            if (elapsed >= 3000) { it.all() = Color(0, 0, 0); return; }
            if (elapsed < 2000) {
              bool on = ((elapsed / 100) % 2) == 0;
              it.all() = on ? Color(200, 0, 0) : Color(0, 0, 0);
            } else {
              it.all() = Color(40, 0, 0);
            }

      # Lives display for Elimination mode: N lit LEDs, color by health
      - addressable_lambda:
          name: "Elimination Lives"
          update_interval: 300ms
          lambda: |-
            int lives = id(elim_current_lives);
            int n = it.size();
            for (int i = 0; i < n; i++) {
              if (i < lives) {
                Color c;
                if (lives <= 1)      c = Color(200, 0,   0);    // red: last life
                else if (lives == 2) c = Color(180, 100, 0);   // amber: danger
                else                 c = Color(0,   180, 0);   // green: healthy
                it[i] = c;
              } else {
                it[i] = Color(0, 0, 0);
              }
            }

      # Board stopped (camera standby time): all LEDs pulse red until the board runs again
      - addressable_lambda:
          name: "Board Stopped"
          update_interval: 100ms
          lambda: |-
            bool on = ((millis() / 500) % 2) == 0;
            it.all() = on ? Color(200, 0, 0) : Color(30, 0, 0);

      # Lives of the player up in Killer: N lit LEDs, yellow until he is a killer, red as a killer
      - addressable_lambda:
          name: "Killer Lives"
          update_interval: 300ms
          lambda: |-
            int lives = id(g_lives);
            Color c = id(g_killer) ? Color(200, 0, 0) : Color(220, 180, 0);
            int n = it.size();
            for (int i = 0; i < n; i++) {
              it[i] = (i < lives) ? c : Color(0, 0, 0);
            }

      - addressable_rainbow:
          name: "Rainbow Test"
          speed: 10
          width: 5
