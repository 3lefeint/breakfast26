      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 2;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
            } else if (id(g_mode) == 2) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              }
            }
    - topic: autodarts/black_belt/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 1 Orange");
              call.perform();
            } else if (v < 0 && (id(g_end_ms) == 0 || millis() - id(g_end_ms) > 10000)) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }
    - topic: autodarts/black_belt/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 2 Yellow");
              call.perform();
            }
    - topic: autodarts/black_belt/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              id(led_effect_start_ms) = (int)now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 3 Sequence");
              call.perform();
            }

    # ── Warm-up ──────────────────────────────────────────────────────────
    - topic: autodarts/warm_up/active
      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 3;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
            } else if (id(g_mode) == 3) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              }
            }
    - topic: autodarts/warm_up/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v == 0) id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 1 Orange");
              call.perform();
            } else if (v < 0 && (id(g_end_ms) == 0 || millis() - id(g_end_ms) > 10000)) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }
    - topic: autodarts/warm_up/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v == 0) id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 2 Yellow");
              call.perform();
            }
    - topic: autodarts/warm_up/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v == 0) id(matrix_last_miss_ms) = now;
              id(led_effect_start_ms) = (int)now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 3 Sequence");
              call.perform();
            }

    # ── Checkout Training ──────────────────────────────────────────────────────────
    - topic: autodarts/checkout_training/active
      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 4;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
            } else if (id(g_mode) == 4) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              }
            }
    - topic: autodarts/checkout_training/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 1 Orange");
              call.perform();
            } else if (v < 0 && (id(g_end_ms) == 0 || millis() - id(g_end_ms) > 10000)) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }
    - topic: autodarts/checkout_training/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 2 Yellow");
              call.perform();
            }
    - topic: autodarts/checkout_training/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              id(led_effect_start_ms) = (int)now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 3 Sequence");
              call.perform();
            }

    # ── Target Battle ──────────────────────────────────────────────────────────
    - topic: autodarts/target_battle/active
      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 5;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
            } else if (id(g_mode) == 5) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              }
            }
    - topic: autodarts/target_battle/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 1 Orange");
              call.perform();
            } else if (v < 0 && (id(g_end_ms) == 0 || millis() - id(g_end_ms) > 10000)) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }
    - topic: autodarts/target_battle/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 2 Yellow");
              call.perform();
            }
    - topic: autodarts/target_battle/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              id(led_effect_start_ms) = (int)now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 3 Sequence");
              call.perform();
            }

    # ── Killer ──────────────────────────────────────────────────────────
    - topic: autodarts/killer/active
      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 6;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Killer Lives");
              call.perform();
            } else if (id(g_mode) == 6) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              auto call = id(autodarts_strip).turn_off();
              call.perform();
              }
            }
    - topic: autodarts/killer/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
    - topic: autodarts/killer/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
    - topic: autodarts/killer/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
    - topic: autodarts/field_training/field
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            id(g_target) = atoi(x.c_str());
    - topic: autodarts/field_training/darts
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            id(g_total) = atoi(x.c_str());
    - topic: autodarts/field_training/thrown
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            id(g_thrown) = atoi(x.c_str());
    - topic: autodarts/field_training/points
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            id(g_points) = atoi(x.c_str());
    - topic: autodarts/field_training/events/finished
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            id(g_end_ms) = millis();
            if (x.find("\"completed\": true") != std::string::npos) {
              id(matrix_last_win_ms) = millis();
              id(led_effect_start_ms) = (int)millis();
              {
                auto call = id(autodarts_strip).turn_on();
                call.set_effect("Win Celebrate");
                call.perform();
              }
            }
    - topic: autodarts/black_belt/target
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            id(g_target) = atoi(x.c_str());
    - topic: autodarts/black_belt/fields_done
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            int v = atoi(x.c_str());
            if (v > id(g_done)) id(matrix_last_hit_ms) = millis();
            id(g_done) = v;
    - topic: autodarts/black_belt/restarts
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            int v = atoi(x.c_str());
            if (v > id(g_restarts)) id(matrix_last_miss_ms) = millis();
            id(g_restarts) = v;
    - topic: autodarts/black_belt/events/finished
      then:
        - lambda: |-
            if (id(g_mode) != 2) return;
            id(g_end_ms) = millis();
            if (x.find("\"belt\": true") != std::string::npos) {
              id(g_belt) = true;
              id(matrix_last_win_ms) = millis();
              id(led_effect_start_ms) = (int)millis();
              {
                auto call = id(autodarts_strip).turn_on();
                call.set_effect("Win Celebrate");
                call.perform();
              }
            }
    - topic: autodarts/warm_up/target
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            // "<kind> <number>": big, small, double, triple, bull (25), eye (50)
            auto sp = x.find(' ');
            if (sp == std::string::npos) return;
            id(g_kind) = x.substr(0, sp);
            id(g_target) = atoi(x.c_str() + sp + 1);
    - topic: autodarts/warm_up/fields_done
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            int v = atoi(x.c_str());
            if (v > id(g_done)) id(matrix_last_hit_ms) = millis();
            id(g_done) = v;
    - topic: autodarts/warm_up/events/finished
      then:
        - lambda: |-
            if (id(g_mode) != 3) return;
            id(g_end_ms) = millis();
            if (x.find("\"complete\": true") != std::string::npos) {
              id(matrix_last_win_ms) = millis();
              id(led_effect_start_ms) = (int)millis();
              {
                auto call = id(autodarts_strip).turn_on();
                call.set_effect("Win Celebrate");
                call.perform();
              }
            }
    - topic: autodarts/checkout_training/remaining
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            id(g_remaining) = x.empty() ? 0 : atoi(x.c_str());
    - topic: autodarts/checkout_training/attempt
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            id(g_attempt) = atoi(x.c_str());
    - topic: autodarts/checkout_training/events/attempt_end
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            if (x.find("\"success\": true") != std::string::npos) id(matrix_last_hit_ms) = millis();
            else id(matrix_last_miss_ms) = millis();
    - topic: autodarts/checkout_training/events/finished
      then:
        - lambda: |-
            if (id(g_mode) != 4) return;
            id(g_end_ms) = millis();
            id(matrix_last_win_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            {
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Win Celebrate");
              call.perform();
            }
    - topic: autodarts/target_battle/target
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            id(g_target) = atoi(x.c_str());
    - topic: autodarts/target_battle/round
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            id(g_round) = atoi(x.c_str());
    - topic: autodarts/target_battle/events/game_won
      then:
        - lambda: |-
            if (id(g_mode) != 5) return;
            id(g_end_ms) = millis();
            id(matrix_last_win_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            {
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Win Celebrate");
              call.perform();
            }
    - topic: autodarts/killer/current_number
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(g_target) = x.empty() ? 0 : atoi(x.c_str());
    - topic: autodarts/killer/current_lives
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(g_lives) = atoi(x.c_str());
    - topic: autodarts/killer/current_killer
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(g_killer) = (x == "true");
    - topic: autodarts/killer/alive
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(g_alive) = atoi(x.c_str());
    - topic: autodarts/killer/events/killer
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(matrix_last_hit_ms) = millis();
    - topic: autodarts/killer/events/hit
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(matrix_last_hit_ms) = millis();
    - topic: autodarts/killer/events/own_goal
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(matrix_last_miss_ms) = millis();
    - topic: autodarts/killer/events/out
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(matrix_last_miss_ms) = millis();
    - topic: autodarts/killer/events/game_won
      then:
        - lambda: |-
            if (id(g_mode) != 6) return;
            id(g_end_ms) = millis();
            id(matrix_last_win_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            {
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Win Celebrate");
              call.perform();
            }

