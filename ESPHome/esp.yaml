esphome:
  name: autodarts-led
  friendly_name: autodarts-led

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  use_address: !secret device_ip   # optional: fixed address for OTA updates
  power_save_mode: none
  output_power: 8.5dB
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    hidden: true
  fast_connect: true
  ap:
    ssid: "Autodarts-Led Fallback Hotspot"
    password: !secret wifi_ap_password

captive_portal:

# Direct MQTT subscription for atomic dart events — bypasses HA entity ordering race.
# Add mqtt_host, mqtt_username, mqtt_password to secrets.yaml.
mqtt:
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  on_message:
    # Fired on every dart. Contains: seq, dart, miss, points, field, multiplier,
    # mode, player_changed. All animation triggers come from here.
    - topic: autodarts/events/dart
      then:
        - lambda: |-
            bool miss = x.find("\"miss\": true") != std::string::npos;
            bool player_changed = x.find("\"player_changed\": true") != std::string::npos;
            uint32_t now = millis();

            if (player_changed) {
              id(matrix_last_player_change_ms) = now;
              ESP_LOGD("autodarts", "dart event: player changed");
            }
            if (miss) {
              id(matrix_last_miss_ms) = now;
              ESP_LOGD("autodarts", "dart event: MISS");
            } else {
              id(matrix_last_hit_ms) = now;
              ESP_LOGD("autodarts", "dart event: HIT");
            }

            // Dart-number LED effect: parse "dart": N from payload
            int dart_no = 0;
            auto pos = x.find("\"dart\":");
            if (pos != std::string::npos) dart_no = atoi(x.c_str() + pos + 7);

            id(led_effect_start_ms) = (int)now;
            auto call = id(autodarts_strip).turn_on();
            if      (dart_no == 1) call.set_effect("Dart 1 Orange");
            else if (dart_no == 2) call.set_effect("Dart 2 Yellow");
            else if (dart_no == 3) call.set_effect("Dart 3 Sequence");
            else return;
            call.perform();

    # Fired after a bust. Red blink → orange (pull darts) → stuck warning.
    - topic: autodarts/events/bust
      then:
        - lambda: |-
            id(matrix_last_bust_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            ESP_LOGD("autodarts", "bust event");
        - light.turn_on:
            id: autodarts_strip
            effect: "Bust Red"

    # Fired when darts are pulled — turn off strip (pull-darts state ends).
    - topic: autodarts/events/turn_end
      then:
        - light.turn_off:
            id: autodarts_strip

    # Fired on game-won and match-won.
    - topic: autodarts/events/won
      then:
        - lambda: |-
            id(matrix_last_win_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            ESP_LOGD("autodarts", "won event");
        - light.turn_on:
            id: autodarts_strip
            effect: "Win Celebrate"

    # Stop LEDs when a new match starts or the current one ends.
    - topic: autodarts/events/match_started
      then:
        - light.turn_off:
            id: autodarts_strip
    - topic: autodarts/events/match_ended
      then:
        - light.turn_off:
            id: autodarts_strip

    # Freeplay dart detected (no active match) — trigger matrix hit animation.
    - topic: autodarts/events/freeplay_dart
      then:
        - lambda: |-
            id(matrix_last_hit_ms) = millis();
            ESP_LOGD("autodarts", "freeplay dart");

    # Freeplay state — store in globals for display lambdas (bypasses HA).
    - topic: autodarts/freeplay/count
      then:
        - lambda: 'id(fp_count) = atoi(x.c_str());'
    - topic: autodarts/freeplay/throw1_name
      then:
        - lambda: 'id(fp_throw1_name) = x;'
    - topic: autodarts/freeplay/throw2_name
      then:
        - lambda: 'id(fp_throw2_name) = x;'
    - topic: autodarts/freeplay/throw3_name
      then:
        - lambda: 'id(fp_throw3_name) = x;'
    - topic: autodarts/freeplay/total
      then:
        - lambda: 'id(fp_total) = atoi(x.c_str());'

    # Fired on Board Status changes. Used for takeout animation.
    - topic: autodarts/events/board_status
      then:
        - lambda: |-
            if (x.find("Takeout") != std::string::npos) {
              id(matrix_last_takeout_ms) = millis();
              ESP_LOGD("autodarts", "board_status: takeout");
            }

    # ── Elimination game ───────────────────────────────────────────────────────
    - topic: autodarts/elimination/active
      then:
        - lambda: |-
            bool was_active = id(elim_active);
            id(elim_active) = (x == "true");
            if (id(elim_active) && !was_active) {
              id(led_effect_start_ms) = (int)millis();
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Elimination Lives");
              call.perform();
            } else if (!id(elim_active) && was_active) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }

    - topic: autodarts/elimination/current_number
      then:
        - lambda: 'id(elim_player_number) = atoi(x.c_str());'

    - topic: autodarts/elimination/current_lives
      then:
        - lambda: 'id(elim_current_lives) = atoi(x.c_str());'

    - topic: autodarts/elimination/lives_max
      then:
        - lambda: 'id(elim_lives_max) = atoi(x.c_str());'

    - topic: autodarts/elimination/target
      then:
        - lambda: 'id(elim_target) = atoi(x.c_str());'

    - topic: autodarts/elimination/freipass
      then:
        - lambda: 'id(elim_freipass) = (x == "true");'

    - topic: autodarts/elimination/current/dart1
      then:
        - lambda: 'id(elim_dart1) = x.empty() ? -1 : atoi(x.c_str());'

    - topic: autodarts/elimination/current/dart2
      then:
        - lambda: 'id(elim_dart2) = x.empty() ? -1 : atoi(x.c_str());'

    - topic: autodarts/elimination/current/dart3
      then:
        - lambda: 'id(elim_dart3) = x.empty() ? -1 : atoi(x.c_str());'

    - topic: autodarts/elimination/current/total
      then:
        - lambda: 'id(elim_total) = x.empty() ? 0 : atoi(x.c_str());'

    - topic: autodarts/elimination/events/life_lost
      then:
        - lambda: |-
            id(elim_last_life_lost_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            ESP_LOGD("autodarts", "elimination: life lost");
        - light.turn_on:
            id: autodarts_strip
            effect: "Life Lost"
        - delay: 1500ms
        - if:
            condition:
              lambda: 'return id(elim_active);'
            then:
              - light.turn_on:
                  id: autodarts_strip
                  effect: "Elimination Lives"

    - topic: autodarts/elimination/events/eliminated
      then:
        - lambda: |-
            id(elim_last_eliminated_ms) = millis();
            id(led_effect_start_ms) = (int)millis();
            ESP_LOGD("autodarts", "elimination: player eliminated");
        - light.turn_on:
            id: autodarts_strip
            effect: "Eliminated"
        - delay: 3000ms
        - if:
            condition:
              lambda: 'return id(elim_active);'
            then:
              - light.turn_on:
                  id: autodarts_strip
                  effect: "Elimination Lives"

    - topic: autodarts/elimination/events/game_won
      then:
        - lambda: |-
            id(elim_active) = false;
            id(led_effect_start_ms) = (int)millis();
        - light.turn_on:
            id: autodarts_strip
            effect: "Win Celebrate"

    # ── Games with their own topics: Field Training, Black Belt, Warm-up, Checkout Training, Target Battle, Killer ──
    # One shared set of globals (g_*) and one mode (g_mode) show whichever of them is running. A run that ended stays on
    # the display for a minute (g_end_ms), a run that was stopped without an end goes back to idle at once.

    # The status of the board. Stopped (camera standby time): the strip pulses red, the displays show it.
    - topic: autodarts/board/status
      then:
        - lambda: |-
            bool stopped = (x == "Stopped" || x == "Board Stopped");
            if (stopped && !id(board_stopped)) {
              id(board_stopped) = true;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Board Stopped");
              call.perform();
            } else if (!stopped && id(board_stopped)) {
              id(board_stopped) = false;
              if (id(g_mode) == 6 && id(g_active)) {
                auto call = id(autodarts_strip).turn_on();
                call.set_effect("Killer Lives");
                call.perform();
              } else if (id(elim_active)) {
                auto call = id(autodarts_strip).turn_on();
                call.set_effect("Elimination Lives");
                call.perform();
              } else {
                auto call = id(autodarts_strip).turn_off();
                call.perform();
              }
            }

    # ── Field Training ──────────────────────────────────────────────────────────
    - topic: autodarts/field_training/active
      then:
        - lambda: |-
            if (x == "true") {
              id(g_mode) = 1;
              id(g_active) = true;
              id(g_end_ms) = 0;
              id(g_belt) = false;
              id(g_dart1) = -1;
              id(g_dart2) = -1;
              id(g_dart3) = -1;
            } else if (id(g_mode) == 1) {
              id(g_active) = false;
              if (id(g_end_ms) == 0) {
                id(g_mode) = 0;
              }
            }
    - topic: autodarts/field_training/current/dart1
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart1) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 1 Orange");
              call.perform();
            } else if (v < 0 && (id(g_end_ms) == 0 || millis() - id(g_end_ms) > 10000)) {
              auto call = id(autodarts_strip).turn_off();
              call.perform();
            }
    - topic: autodarts/field_training/current/dart2
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart2) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 2 Yellow");
              call.perform();
            }
    - topic: autodarts/field_training/current/dart3
      then:
        - lambda: |-
            if (id(g_mode) != 1) return;
            int v = x.empty() ? -1 : atoi(x.c_str());
            id(g_dart3) = v;
            if (v >= 0 && !id(board_stopped)) {
              uint32_t now = millis();
              if (v > 0) id(matrix_last_hit_ms) = now;
              else id(matrix_last_miss_ms) = now;
              id(led_effect_start_ms) = (int)now;
              auto call = id(autodarts_strip).turn_on();
              call.set_effect("Dart 3 Sequence");
              call.perform();
            }

    # ── Black Belt ──────────────────────────────────────────────────────────
