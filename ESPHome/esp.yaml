# ─── Displays ─────────────────────────────────────────────────────────────────

display:
  # 8x8 LED matrix — animations driven by MQTT dart events
  - platform: max7219digit
    id: autodarts_matrix
    cs_pin: GPIO5
    num_chips: 1
    intensity: 5
    update_interval: 80ms
    lambda: |-
      it.clear();
      const uint32_t now = millis();

      // 90° CW rotation: compensates physical display mount orientation.
      // All pixel draws use px(x,y) instead of draw_pixel_at(x,y).
      auto px = [&](int x, int y) {
        it.draw_pixel_at(7 - y, x, COLOR_ON);
      };

      // ── Draw helpers ──────────────────────────────────────────────────────

      auto draw_miss_x = [&]() {
        for (int i = 0; i < 8; i++) {
          px(i, i);
          px(7 - i, i);
        }
      };

      auto draw_hit_center = [&]() {
        px(3, 3); px(4, 3); px(3, 4); px(4, 4);
      };

      auto draw_ring = [&](int cx, int cy, int r) {
        for (int dx = -r; dx <= r; dx++) {
          for (int dy = -r; dy <= r; dy++) {
            int ax = cx + dx, ay = cy + dy;
            if (ax < 0 || ax > 7 || ay < 0 || ay > 7) continue;
            int d2 = dx * dx + dy * dy;
            if (d2 >= (r * r - r) && d2 <= (r * r + r)) px(ax, ay);
          }
        }
      };

      auto draw_plus = [&](int cx, int cy) {
        for (int i = -2; i <= 2; i++) {
          if (cx + i >= 0 && cx + i < 8) px(cx + i, cy);
          if (cy + i >= 0 && cy + i < 8) px(cx, cy + i);
        }
      };

      auto draw_takeout_o = [&]() {
        for (int i = 1; i <= 6; i++) {
          px(i, 1); px(i, 6);
          px(1, i); px(6, i);
        }
        // clear corners to round the shape
        it.draw_pixel_at(7 - 1, 1, COLOR_OFF);
        it.draw_pixel_at(7 - 1, 6, COLOR_OFF);
        it.draw_pixel_at(7 - 6, 1, COLOR_OFF);
        it.draw_pixel_at(7 - 6, 6, COLOR_OFF);
      };

      auto draw_exclamation = [&]() {
        for (int i = 1; i <= 4; i++) px(3, i);
        px(3, 6);
      };

      auto draw_player_arrow = [&]() {
        // Right-pointing arrow in logical space → downward after 90° CW
        px(1, 3); px(2, 3); px(3, 3); px(4, 3); px(5, 3);
        px(4, 2); px(4, 4); px(6, 3);
      };

      auto draw_idle_center = [&]() {
        px(3, 3); px(4, 3); px(3, 4); px(4, 4);
      };

      // ── Stopped board ─────────────────────────────────────────────────────

      if (id(board_stopped)) {
        for (int i = 2; i <= 5; i++) {
          for (int j = 2; j <= 5; j++) px(i, j);
        }
        return;
      }

      // ── Games with their own topics: the target as a number, the animations of the events ─────

      int mode = id(g_mode);
      if (mode != 0 && !id(g_active) && id(g_end_ms) != 0 && now - id(g_end_ms) >= 60000) {
        id(g_mode) = 0;          // the end was on the display for a minute
        mode = 0;
      }
      if (mode != 0) {
        if (now - id(matrix_last_win_ms) < 2000) {
          bool on = ((now / 250) % 2) == 0;
          if (on) {
            it.rectangle(0, 0, 8, 8, COLOR_ON);
          } else {
            it.rectangle(1, 1, 6, 6, COLOR_ON);
          }
          return;
        }
        if (now - id(matrix_last_miss_ms) < 1200) {
          bool on = ((now / 140) % 2) == 0;
          if (on) draw_miss_x();
          return;
        }
        if (now - id(matrix_last_hit_ms) < 1200) {
          uint32_t dt = now - id(matrix_last_hit_ms);
          if (dt < 300) {
            draw_hit_center();
          } else if (dt < 600) {
            draw_hit_center();
            draw_ring(3, 3, 2);
          } else if (dt < 900) {
            draw_ring(3, 3, 3);
          } else {
            draw_hit_center();
          }
          return;
        }

        // Idle: the target (a field or a number) as two small digits, the bull as a ring.
        int n = id(g_target);
        bool bull = (mode == 1 || mode == 2) ? (n == 25) : (mode == 3 && (id(g_kind) == "bull" || id(g_kind) == "eye"));
        if (mode == 4 || n < 1 || n > 99) {
          draw_idle_center();
        } else if (bull) {
          draw_ring(3, 3, 2);
          draw_hit_center();
        } else {
          // 3x5 digits, the left bit is the left column
          static const uint8_t FONT[10][5] = {
            {7,5,5,5,7}, {2,6,2,2,7}, {7,1,7,4,7}, {7,1,7,1,7}, {5,5,7,1,1},
            {7,4,7,1,7}, {7,4,7,5,7}, {7,1,1,1,1}, {7,5,7,5,7}, {7,5,7,1,7},
          };
          auto draw_digit = [&](int d, int x0) {
            for (int r = 0; r < 5; r++) {
              for (int c = 0; c < 3; c++) {
                if (FONT[d][r] & (4 >> c)) px(x0 + c, 1 + r);
              }
            }
          };
          if (n >= 10) {
            draw_digit(n / 10, 0);
            draw_digit(n % 10, 4);
          } else {
            draw_digit(n, 2);
          }
        }
        return;
      }

      // ── Elimination mode ──────────────────────────────────────────────────

      if (id(elim_active)) {
        uint32_t dt_elim = now - id(elim_last_eliminated_ms);
        uint32_t dt_life = now - id(elim_last_life_lost_ms);

        if (dt_elim < 2000) {
          // Eliminated: fast-blinking full X
          bool on = ((now / 100) % 2) == 0;
          if (on) draw_miss_x();
          return;
        }

        if (dt_life < 1500) {
          // Life lost: blinking minus bar
          bool on = ((now / 200) % 2) == 0;
          if (on) {
            for (int i = 1; i <= 6; i++) { px(i, 3); px(i, 4); }
          }
          return;
        }

        // Show current player number as large digit
        int n = id(elim_player_number);
        if (n >= 1 && n <= 9) {
          static const uint8_t DIGITS[10][8] = {
            {0x3C,0x42,0x42,0x42,0x42,0x42,0x3C,0x00}, // 0 (unused)
            {0x10,0x30,0x10,0x10,0x10,0x10,0x38,0x00}, // 1
            {0x3C,0x42,0x02,0x0C,0x30,0x40,0x7E,0x00}, // 2
            {0x3C,0x42,0x02,0x1C,0x02,0x42,0x3C,0x00}, // 3
            {0x08,0x18,0x28,0x48,0x7E,0x08,0x08,0x00}, // 4
            {0x7E,0x40,0x7C,0x02,0x02,0x42,0x3C,0x00}, // 5
            {0x3C,0x40,0x40,0x7C,0x42,0x42,0x3C,0x00}, // 6
            {0x7E,0x02,0x04,0x08,0x10,0x10,0x10,0x00}, // 7
            {0x3C,0x42,0x42,0x3C,0x42,0x42,0x3C,0x00}, // 8
            {0x3C,0x42,0x42,0x3E,0x02,0x42,0x3C,0x00}, // 9
          };
          for (int row = 0; row < 8; row++) {
            uint8_t pat = DIGITS[n][row];
            for (int col = 0; col < 8; col++) {
              if (pat & (0x80 >> col)) px(col, row);
            }
          }
        }
        return;
      }

      bool match_on = id(ad_match_started).has_state() && id(ad_match_started).state;
      if (!match_on) {
        return;
      }

      int remaining = id(ad_remaining).has_state() ? (int) id(ad_remaining).state : 999;

      // ── Animation priority (highest first) ────────────────────────────────

      if (now - id(matrix_last_player_change_ms) < 1200) {
        bool on = ((now / 120) % 2) == 0;
        if (on) draw_player_arrow();
        return;
      }

      if (now - id(matrix_last_win_ms) < 2000) {
        bool on = ((now / 250) % 2) == 0;
        if (on) {
          it.rectangle(0, 0, 8, 8, COLOR_ON);
        } else {
          it.rectangle(1, 1, 6, 6, COLOR_ON);
        }
        return;
      }

      if (now - id(matrix_last_bust_ms) < 1500) {
        bool on = ((now / 160) % 2) == 0;
        if (on) draw_plus(3, 3);
        return;
      }

      if (now - id(matrix_last_miss_ms) < 1200) {
        bool on = ((now / 140) % 2) == 0;
        if (on) draw_miss_x();
        return;
      }

      if (now - id(matrix_last_takeout_ms) < 1500) {
        draw_takeout_o();
        return;
      }

      if (now - id(matrix_last_hit_ms) < 1200) {
        uint32_t dt = now - id(matrix_last_hit_ms);
        if (dt < 300) {
          draw_hit_center();
        } else if (dt < 600) {
          draw_hit_center();
          draw_ring(3, 3, 2);
        } else if (dt < 900) {
          draw_ring(3, 3, 3);
        } else {
          draw_hit_center();
        }
        return;
      }

      // ── Idle display ──────────────────────────────────────────────────────

      if (remaining < 50) {
        draw_exclamation();
        return;
      }

      if (remaining < 100) {
        px(7, 7);
        return;
      }

      draw_idle_center();

