        if (v < 0) strcpy(buf, "   -");
        else snprintf(buf, sizeof(buf), "%4d", v);
        it.print(buf);
        return;
      }

      bool match_on = id(ad_match_started).has_state() && id(ad_match_started).state;

      if (!match_on) {
        char seg[5];
        std::string n = id(fp_count) >= 1 ? id(fp_throw1_name) : "";
        if (n.size() >= 2 && (n[0]=='S'||n[0]=='D'||n[0]=='T')) {
          char p = n[0]=='T' ? 't' : n[0]=='D' ? 'd' : 'S';
          snprintf(seg, sizeof(seg), "%c%3s", p, n.substr(1).c_str());
        } else if (!n.empty() && n[0] != 'm' && n[0] != 'M' && n != "Outside") {
          snprintf(seg, sizeof(seg), "%4s", n.substr(0,4).c_str());
        } else if (!n.empty()) { strcpy(seg, "   0");   // thrown, missed the board
        } else { strcpy(seg, "   -"); }                  // not thrown yet
        it.print(seg);
        return;
      }

      int dart_no = id(ad_last_dart_number).has_state() ? (int) id(ad_last_dart_number).state : 0;
      bool turn_active = id(ad_turn_active).has_state() && id(ad_turn_active).state;

      if (!turn_active || dart_no < 1) {
        it.print("   -");
        return;
      }

      int p1 = id(ad_throw_1_points).has_state() ? (int) id(ad_throw_1_points).state : 0;
      char buf[5];
      snprintf(buf, sizeof(buf), "%4d", p1);
      it.print(buf);

