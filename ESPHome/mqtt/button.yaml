button:
- name: "Autodarts Notebook herunterfahren"
  unique_id: autodarts_notebook_shutdown
  command_topic: "autodarts/notebook/cmd"
  payload_press: "shutdown"

- name: "Autodarts Notebook neu starten"
  unique_id: autodarts_notebook_reboot
  command_topic: "autodarts/notebook/cmd"
  payload_press: "reboot"

- name: "Autodarts Service restart"
  unique_id: autodarts_service_restart
  command_topic: "autodarts/notebook/cmd"
  payload_press: "restart_autodarts"

- name: "Breakfast restart"
