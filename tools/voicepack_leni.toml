# Voice-pack generation plan for "leni" (de-CH-LeniNeural via edge-tts).
#
# Edit texts/rate/pitch/volume below, then run:
#   python tools/generate_voicepack.py tools/voicepack_leni.toml
#
# Each [[group]] below is one category — it gets its own default rate/pitch/
# volume, applied to every key in it unless a key overrides them individually.
# rate/volume are relative percentages ("+5%", "-5%"), pitch is relative Hz
# ("+5Hz", "-5Hz"). "+0%"/"+0Hz" = voice default.
# Keep pitch within -5Hz..+5Hz — bigger swings made the voice sound too
# different between categories (decided after listening). Rate was bumped
# +15 percentage points across every group/key on top of that same relative
# spread (speed-up request) — the old -5%..+5% ceiling for rate no longer
# applies, only the relative spread between categories still matters.
#
# Two ways to list entries in a group:
#   - keys.<key> = "spoken text"                          (explicit key -> text)
#   - keys.<key> = { text = "...", rate = "...", ... }     (same, with a per-key
#                                                            prosody override)
#   - keys.<key> = { variants = ["...", "..."], ... }      (multiple recordings
#                                                            of the same key —
#                                                            <key>.mp3,
#                                                            <key>+1.mp3, ... —
#                                                            picked at random)
#   - range.start / range.end / range.exclude              (a numeric run, text
#                                                            defaults to the
#                                                            plain number;
#                                                            range.overrides.<n>
#                                                            works the same way
#                                                            as keys.<key> above,
#                                                            variants included)

voice = "de-CH-LeniNeural"

