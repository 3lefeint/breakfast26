# ─────────────────────────────────────────────────────────────────────────
# Checkout numbers — required ("you require N"). Same digits, calm tone.
# Bogey numbers (159,162,163,165,166,168,169) are excluded — no checkout
# call ever exists for them, see VOICE_PACKS.md.
#
# NOTE on why achieved/checkout numbers were left alone this round: with
# 181 + 162 = 343 individual numbers, hand-writing a genuine second dialect
# reading for every one is a much bigger job than the ~70 named phrases
# above (which are one-off wording choices), and it's the kind of content
# where authenticity really matters — better to do a handful yourself as
# real examples first (via range.overrides.<n>, same syntax as everywhere
# else) than have all 343 auto-filled with guessed dialect numerals. Say
# the word if you'd like the full range done anyway.
# ─────────────────────────────────────────────────────────────────────────
[[group]]
name = "Score - required / checkout (2-170)"
rate = "+10%"
pitch = "-5Hz"
volume = "+0%"

[group.range]
start = 2
end = 170
exclude = [159, 162, 163, 165, 166, 168, 169]
key_prefix = "require_"

# ─────────────────────────────────────────────────────────────────────────
# Elimination-specific phrases
# ─────────────────────────────────────────────────────────────────────────
[[group]]
name = "Elimination"
rate = "+15%"
pitch = "+0Hz"
volume = "+0%"

[group.keys.freipass]
# Played right after a player-name call now
# ("Peter, du hesch en Freipass") — already fits, no change needed.
variants = ["du hesch en freipass", "freipass für dich"]

[group.keys.filler_after_name]
# New key, played right after the first player's name at
# match start ("Neus Spiel, Peter, du bisch am Zug").
variants = ["du bisch am zug", "du bisch dra", "go for it!"]

[group.keys.filler_target]
# New key, played right after the incoming player's
# name (when they don't have a freipass) and right before the target
# number ("Peter, du bruchsch 42").
variants = ["du bruchsch", "es bruucht"]

[group.keys.miss]
variants = ["danebe", "verfehlt", "miss", "siiro"]

[group.keys.eliminated]
# Played right after a player-name call now
# ("Peter, du bisch dusse") — old standalone phrasing replaced.
variants = ["du bisch dusse", "you lost"]

[group.keys.close]
variants = ["aber das isch knapp gsieh", "knapp dra verbi"]
rate = "+20%"
pitch = "+5Hz"

[group.keys.too_low]
variants = ["das isch chli wenig gsieh", "minimalist", "eeemoschional damaaasch"]
rate = "+10%"
pitch = "-5Hz"

[group.keys.nice]
variants = ["Stark!", "Mega!"]
rate = "+20%"
pitch = "+5Hz"

[group.keys.life_lost]
# Played right after a player-name call now
# ("Peter, du hesch es Lebe verlore") — "minus eis" already fit, kept.
variants = ["du hesch es lebe verlore", "minus eis"]
# rate = "0%"
pitch = "-5Hz"

# ─────────────────────────────────────────────────────────────────────────
# Target Battle-specific phrases (the wheel sound is a file you supply, not
# generated here: put wheel.mp3 into the sound directory)
# ─────────────────────────────────────────────────────────────────────────
[[group]]
name = "Target Battle"
rate = "+15%"
pitch = "+0Hz"
volume = "+0%"

[group.keys.target_is]
# Played once the wheel has landed, right before the target number
# ("S Ziel isch 17").
variants = ["s ziel isch", "es ziel isch"]


# ─────────────────────────────────────────────────────────────────────────
# Killer-specific phrases (the names and numbers come from the other groups;
# life_lost, eliminated, filler_after_name and matchshot are played too)
# ─────────────────────────────────────────────────────────────────────────
[[group]]
name = "Killer"
rate = "+15%"
pitch = "+0Hz"
volume = "+0%"

[group.keys.your_number]
# Played after a player-name call when the player is up for the first time,
# right before the number ("Peter, dini Zahl isch 17").
variants = ["dini zahl isch", "du hesch d zahl"]

[group.keys.bull_off]
# Played after a player-name call when the player throws at the bull to
# decide who starts ("Peter, uf s Bull").
variants = ["uf s bull", "wirf ufs bull"]

[group.keys.bull_off_tie]
# Played when players are tied for the closest dart at the bull and throw
# again ("Gliichstand, nomal ufs Bull").
variants = ["gliichstand, nomal ufs bull", "es unentschide, nomal"]

[group.keys.starts_game]
# Played after a player-name call when the bull-off is won and the numbers
# are thrown next ("Peter, du fangsch aa").
variants = ["du fangsch aa", "du darfsch aafah"]

[group.keys.throw_number]
# Played after a player-name call when the player throws for their number
# with the other hand ("Peter, wirf mit links dini Zahl").
variants = ["wirf mit dim schwache arm", "mit de andere hand dini zahl"]

[group.keys.throw_again]
# Played after a player-name call when the throw gave no number: the
# number is taken, or the dart hit the bull or missed ("Peter, nomal").
variants = ["nomal", "das het nöd gzellt, nomal"]

[group.keys.is_killer]
# Played right after a player-name call when a double on the own number
# makes a killer ("Peter, du bisch en Killer").
variants = ["du bisch en killer", "du bisch jetzt scharf"]
pitch = "-5Hz"

[group.keys.own_goal]
# Played right after a player-name call when a killer hits their own
# number ("Peter, es Eigetor").
variants = ["es eigetor", "das isch es eigetor"]
pitch = "-5Hz"


# ─────────────────────────────────────────────────────────────────────────
# Player names — one entry per PERSON, key = the exact lowercase name they
# are registered under in the app's player list (that's what the caller
# looks up at announce time, e.g. registered as "Peter" -> looks for
# peter.mp3). The person is always registered under that one name — the
# `variants` list is different NICKNAME PRONUNCIATIONS of that same
# person, generated as variants of the same key (peter.mp3, peter+1.mp3,
# peter+2.mp3, ...) and picked at random each time, same as every other
# variant set in this pack (t20+1.mp3 etc.). Not for different people —
# each real person gets their own [group.keys.<name>] block below.
# ─────────────────────────────────────────────────────────────────────────
[[group]]
name = "Player names"
rate = "+15%"
pitch = "+0Hz"
volume = "+0%"

[group.keys]

[group.keys.unknown_player]
# Fallback when a registered player's name has no recording —
# replaces the old silent player{N} fallback entirely.
variants = ["mister x", "mister!", "dude", "mister wiis"]

# --- Peter (example — replace with your own friends below) ---

[group.keys.peter]
variants = ["Peter", "Piiit", "Pete", "P"]

