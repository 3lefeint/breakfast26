# Plan for tools/generate_badges.py: the achievement badge motifs.
#
# [defaults] style is the style (tools/badge_styles/<style>.txt) of every mode
# that has none of its own.
#
# [modes.*] is the accent colour a motif is drawn in, and optionally its own
# `style`. The hex values are placeholders, adjust them to the UI palette.
#
# [[badge]]
#   id          file name of the motif and key of the achievement
#   mode        one of the [modes.*] keys
#   difficulty  easy, medium, hard, very_hard, extreme, endurance or hidden
#               (drawn by the frontend as the rim, not part of the motif)
#   label       optional short text or number drawn on top by the frontend
#   subject     one concrete object, described without any text
#   colour      optional: "accent" (default, the motif is drawn in the mode
#               colour) or "natural" (natural colours, the mode colour only as
#               an accent on one small detail), for things like toast or plates

[defaults]
style = "soft3d"

[modes.general]
name = "turquoise"
hex = "#1ABC9C"

[modes.x01]
name = "blue"
hex = "#1D4ED8"

[modes.elimination]
name = "orange"
hex = "#F97316"
style = "felt"

[modes.killer]
name = "crimson"
hex = "#E11D48"
style = "tattoo"

[modes.target_battle]
name = "olive"
hex = "#5D5631"
style = "steampunk"

[modes.easter_egg]
name = "plum"
hex = "#581845"
style = "balloon"

