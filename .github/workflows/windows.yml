name: Windows build

# Builds the standalone Windows version, tests it on the runner (start, update, rollback) and,
# for a version tag, attaches it to the GitHub release.
on:
  push:
    tags: ["v*"]
    branches: [windows-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            windows/requirements-build.txt

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install the Python packages
        run: pip install -r windows/requirements-build.txt

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          New-Item -ItemType Directory windows/ffmpeg -Force | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName windows/ffmpeg/
          $license = Get-ChildItem ffmpeg-unpacked -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName windows/ffmpeg/LICENSE.txt }
          windows/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - name: Build the program
        run: pyinstaller windows/breakfast.spec --noconfirm --distpath dist --workpath build

      - name: Package it
        id: package
        run: |
          $version = python -c "from breakfast import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item windows/README-windows.txt, windows/install-autostart.ps1, windows/remove-autostart.ps1 dist/breakfast/
          New-Item -ItemType Directory release -Force | Out-Null
          $name = "breakfast-windows-v$version.zip"
          Compress-Archive -Path dist/breakfast -DestinationPath "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "release/$name.sha256"
          Get-ChildItem release | Format-Table Name, Length

      # A signing step goes here once the SignPath Foundation has approved the project.

      - name: Smoke test the packaged program
        run: |
          $version = "${{ steps.package.outputs.version }}"
          Expand-Archive "release/breakfast-windows-v$version.zip" -DestinationPath smoke
          $exe = (Resolve-Path "smoke/breakfast/breakfast.exe").Path
          $p = Start-Process $exe -PassThru -WindowStyle Hidden
          $health = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { $health = Invoke-RestMethod http://127.0.0.1:8080/api/health -TimeoutSec 3; break } catch { }
          }
          if (-not $health) { throw "Breakfast did not answer" }
          if ($health.version -ne $version) { throw "wrong version $($health.version)" }
          foreach ($path in "/", "/tv", "/audio", "/api/changelog", "/api/voicepack/packs") {
            $r = Invoke-WebRequest "http://127.0.0.1:8080$path" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "$path answered $($r.StatusCode)" }
          }
          $packs = Invoke-RestMethod http://127.0.0.1:8080/api/voicepack/packs
          if ($packs.packs.Count -lt 2) { throw "the voice-pack plans are missing" }
          & "smoke/breakfast/_internal/ffmpeg/ffmpeg.exe" -version | Select-Object -First 1
          if (-not (Test-Path "smoke/breakfast/data/config.toml")) { throw "no first-run config" }
          taskkill /F /T /IM breakfast.exe | Out-Null

      - name: Build a newer version for the update test
        run: |
          (Get-Content breakfast/__init__.py) -replace '__version__ = ".*"', '__version__ = "999.0.0"' | Set-Content breakfast/__init__.py
          pyinstaller windows/breakfast.spec --noconfirm --distpath dist-b --workpath build-b
          git checkout breakfast/__init__.py
          New-Item -ItemType Directory release-test -Force | Out-Null
          Compress-Archive -Path dist-b/breakfast -DestinationPath release-test/newer.zip

      - name: Test the update and the rollback
        run: python windows/e2e_update_test.py "release/breakfast-windows-v${{ steps.package.outputs.version }}.zip" release-test/newer.zip 999.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: breakfast-windows
          path: release/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.package.outputs.version }}"
          if ($tag -ne "v$version") { throw "the tag $tag does not match the version $version" }
          python windows/release_notes.py $tag | Out-File -Encoding utf8 notes.md
          gh release create $tag --title "Breakfast $tag" --notes-file notes.md --verify-tag "release/breakfast-windows-$tag.zip" "release/breakfast-windows-$tag.zip.sha256"
